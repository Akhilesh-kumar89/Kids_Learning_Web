<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress — Kids Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .progress-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 24px 0 12px;
  }
  .progress-stat{
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 26px 20px;
    text-align:center;
  }
  .progress-stat .big{
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: var(--navy);
    display:block;
  }
  .progress-stat .label{ color:#7482a0; font-weight:700; font-size:0.9rem; }
  .history-cards{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 10px 0 40px;
  }
  .history-cards h3{ margin-bottom:12px; }
  .history-cards ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .history-cards li{
    background: var(--cream);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-weight: 600;
  }
  .history-cards li.empty{ background:none; padding-left:0; color:#7482a0; font-weight:400; }
  @media (max-width: 800px){
    .progress-grid{ grid-template-columns: 1fr; }
    .history-cards{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="blob-bg"><span></span><span></span><span></span></div>

<div class="page">
  <header class="site-header">
    <div class="wrap nav-bar">
      <div class="brand">
        <img src="assets/images/logo.png" alt="Kids Learning Hub logo">
        Kids Learning Hub
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="maths.html">Maths Practice</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="progress.html">Progress</a></li>
      </ul>
      <button class="sound-toggle" data-sound-toggle aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main class="wrap">
    <h1>Meri Progress</h1>

    <div class="progress-grid">
      <div class="progress-stat">
        <img src="assets/images/trophy.png" alt="" style="width:56px;margin:0 auto 8px;">
        <span class="big" data-total-stars>0</span>
        <span class="label">Total Stars</span>
      </div>
      <div class="progress-stat">
        <span class="big" data-maths-accuracy>0%</span>
        <span class="label">Maths Accuracy</span>
      </div>
      <div class="progress-stat">
        <span class="big" data-maths-streak>0</span>
        <span class="label">Best Streak</span>
      </div>
    </div>

    <div class="history-cards">
      <div class="card">
        <h3>Quiz History</h3>
        <ul data-quiz-history></ul>
      </div>
      <div class="card">
        <h3>Game Best Scores</h3>
        <ul data-game-bests></ul>
      </div>
    </div>

    <p style="color:#7482a0;">Total sawaal solve kiye: <strong data-maths-answered>0</strong></p>

    <div class="row" style="margin-bottom:40px;">
      <button class="btn ghost" data-reset-progress>Progress reset karo</button>
    </div>
  </main>

  <footer class="site-footer">
    Made with ❤️ for little learners.
  </footer>
</div>

<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/progress.js"></script>
</body>
</html>
