<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result — Kids Learning Hub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .result-card{
    max-width: 520px;
    margin: 40px auto;
    text-align:center;
  }
  .result-card img{ width:120px; margin: 0 auto 20px; }
  .result-card .score{
    font-family: var(--font-display);
    font-size: 3rem;
    color: var(--navy);
    margin-bottom: 6px;
  }
  .result-card .subject{ color:#7482a0; font-weight:700; margin-bottom:18px; }
</style>
</head>
<body>
<div class="blob-bg"><span></span><span></span><span></span></div>

<div class="page">
  <header class="site-header">
    <div class="wrap nav-bar">
      <div class="brand">
        <img src="assets/images/logo.png" alt="Kids Learning Hub logo">
        Kids Learning Hub
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="maths.html">Maths Practice</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="progress.html">Progress</a></li>
      </ul>
      <button class="sound-toggle" data-sound-toggle aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main class="wrap">
    <div class="card result-card">
      <img src="assets/images/trophy.png" alt="Trophy" data-result-trophy>
      <div class="subject" data-result-subject>Quiz Result</div>
      <div class="score" data-result-score>--</div>
      <p data-result-message>Result load ho raha hai...</p>
      <div class="row" style="justify-content:center;">
        <a class="btn" href="quiz.html">Dubara khelo</a>
        <a class="btn ghost" href="progress.html">Progress dekho</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    Made with ❤️ for little learners.
  </footer>
</div>

<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/result.js"></script>
</body>
</html>
